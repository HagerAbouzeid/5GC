{{- range .Values.nfs }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open5gs-{{ .name }}
  namespace: open5gs
spec:
  replicas: 1
  selector:
    matchLabels:
      app: open5gs-{{ .name }}
  template:
    metadata:
      labels:
        app: open5gs-{{ .name }}
    spec:
      {{- if .privileged }}
      initContainers:
        - name: net-setup
          image: alpine:3.20
          securityContext:
            privileged: true
          command: ["/bin/sh", "-c"]
          args:
            - |
              apk add --no-cache iptables
              sysctl -w net.ipv4.ip_forward=1
              iptables -t nat -A POSTROUTING -s 10.45.0.0/16 ! -o ogstun -j MASQUERADE
      {{- end }}
      containers:
        - name: {{ .name }}
          image: {{ $.Values.image }}
          imagePullPolicy: Always
          env:
            - name: POD_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.podIP
          command: ["/bin/sh", "-c"]
          args:
            - |
              sed "s/__POD_IP__/${POD_IP}/g" /etc/open5gs/{{ .name }}.yaml > /tmp/{{ .name }}.yaml
              exec {{ .daemon }} -c /tmp/{{ .name }}.yaml
          {{- if .privileged }}
          securityContext:
            capabilities:
              add: ["NET_ADMIN"]
          {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/open5gs
            {{- if eq .name "udm" }}
            - name: hnet
              mountPath: /etc/open5gs/hnet
            {{- end }}
            {{- if .privileged }}
            - name: dev-net-tun
              mountPath: /dev/net/tun
            {{- end }}
      volumes:
        - name: config
          configMap:
            name: open5gs-{{ .name }}-config
        {{- if eq .name "udm" }}
        - name: hnet
          secret:
            secretName: open5gs-udm-hnet
        {{- end }}
        {{- if .privileged }}
        - name: dev-net-tun
          hostPath:
            path: /dev/net/tun
            type: CharDevice
        {{- end }}
---
{{- end }}
